name: Message File Diff Checker

on:
  pull_request:
    paths:
      - 'dbo.CMS_MESSAGE.EN06 (11).txt'

jobs:
  diff-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic
      
      - name: Get base branch file
        run: |
          # Fetch the base branch version of the file
          git show origin/${{ github.base_ref }}:"dbo.CMS_MESSAGE.EN06 (11).txt" > base_file.txt 2>/dev/null || echo "" > base_file.txt
          
          # Copy the PR version
          cp "dbo.CMS_MESSAGE.EN06 (11).txt" head_file.txt
      
      - name: Run diff analysis
        id: diff
        run: |
          python .github/scripts/message_diff.py base_file.txt head_file.txt > diff_output.md
          
          # Store diff output
          {
            echo 'DIFF_OUTPUT<<EOF'
            cat diff_output.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      
      - name: Generate Message Suggestions
        id: suggestions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python .github/scripts/message_suggestions.py diff_output.md > suggestions.md
          
          # Store suggestions
          {
            echo 'SUGGESTIONS<<EOF'
            cat suggestions.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      
      - name: Post PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 📊 CMS Message File Changes Detected
            
            ### 💡 Message Style Suggestions
            ${{ steps.suggestions.outputs.SUGGESTIONS }}
            
            ---
            
            ### 📋 Detailed Changes
            ${{ steps.diff.outputs.DIFF_OUTPUT }}
            
            ---
            *Automatically generated by Message File Diff Checker*

